# Nginx configuration for the Translation Management Service API.
#
# This is a JSON-only API (no Blade views, no built frontend assets in
# public/ beyond the default favicon.ico/robots.txt), so this container
# does not need any filesystem access to the application code - it only
# needs to know the application's `public` path for constructing the
# fastcgi SCRIPT_FILENAME, and to forward every request to PHP-FPM
# (`app:9000`), which reads the actual files from its own image.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Reasonable request body limit (JSON payloads, e.g. translations with
    # many tags/long content, plus any future file-based input).
    client_max_body_size 20M;

    # Deny access to hidden files (.env, .git, etc.) if ever present.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
}
