openapi: 3.1.0

info:
  title: Translation Management Service API
  version: "1.0.0"
  description: >-
    JSON API for managing multi-locale application translations: keys,
    per-locale content, tags, search/filter, cursor pagination, and
    per-locale JSON export. Authentication uses Laravel Sanctum bearer
    tokens. This specification documents the API as actually implemented
    (routes/api.php, controllers, form requests, and resources) — it does
    not describe planned or aspirational behavior.

servers:
  - url: http://localhost:8000
    description: Local PHP development
  - url: http://localhost:8080
    description: Docker Compose

tags:
  - name: Authentication
    description: Registration, login, current user, and logout.
  - name: Translations
    description: CRUD, search, filtering, and cursor pagination for translations.
  - name: Export
    description: Bulk per-locale JSON export.

security: []

paths:
  /api/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register a new user
      description: >-
        Creates a user account and returns a bearer token. Public endpoint;
        throttled to 5 requests/minute per email+IP combination (the `auth`
        rate limiter).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
            example:
              name: Ada Lovelace
              email: ada@example.com
              password: Password123
              password_confirmation: Password123
              device_name: iphone-15
      responses:
        '201':
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
              example:
                message: User registered successfully.
                data:
                  user:
                    id: 1
                    name: Ada Lovelace
                    email: ada@example.com
                    email_verified_at: null
                    created_at: '2026-09-03T12:00:00.000000Z'
                    updated_at: '2026-09-03T12:00:00.000000Z'
                  token: '1|abcdef1234567890'
                  token_type: Bearer
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /api/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Authenticate and obtain a bearer token
      description: >-
        Public endpoint; throttled to 5 requests/minute per email+IP
        combination (the `auth` rate limiter). On failure, always returns
        the same generic message regardless of whether the email exists,
        to avoid user enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ada@example.com
              password: Password123
              device_name: iphone-15
      responses:
        '200':
          description: Logged in successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
              example:
                message: Logged in successfully.
                data:
                  user:
                    id: 1
                    name: Ada Lovelace
                    email: ada@example.com
                    email_verified_at: null
                    created_at: '2026-09-03T12:00:00.000000Z'
                    updated_at: '2026-09-03T12:00:00.000000Z'
                  token: '2|zyxwvu0987654321'
                  token_type: Bearer
        '422':
          description: >-
            Invalid credentials, or the request failed validation. The
            `email` field carries "The provided credentials are incorrect."
            when authentication fails, even if the email does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The given data was invalid.
                errors:
                  email:
                    - The provided credentials are incorrect.
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /api/user:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get the authenticated user
      description: Requires a valid bearer token. Throttled by the `api` rate limiter (60 requests/minute per user).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
              example:
                data:
                  id: 1
                  name: Ada Lovelace
                  email: ada@example.com
                  email_verified_at: null
                  created_at: '2026-09-03T12:00:00.000000Z'
                  updated_at: '2026-09-03T12:00:00.000000Z'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /api/logout:
    post:
      tags: [Authentication]
      operationId: logoutUser
      summary: Revoke the current access token
      description: >-
        Revokes only the token used to authenticate this request, not all
        of the user's tokens. Throttled by the `api` rate limiter.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully.
              example:
                message: Logged out successfully.
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /api/translations:
    get:
      tags: [Translations]
      operationId: listTranslations
      summary: List and search translations
      description: >-
        Cursor-paginated listing with optional key/content/locale/tag
        filtering and a combined `search` parameter. Throttled by the
        `api` rate limiter.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Matches translations whose key starts with this value OR whose content matches it (FULLTEXT on MySQL, LIKE on SQLite).
          schema:
            type: string
            maxLength: 255
        - name: key
          in: query
          description: Prefix match against the translation key.
          schema:
            type: string
            maxLength: 255
        - name: content
          in: query
          description: Content match — FULLTEXT search on MySQL, LIKE '%value%' fallback on SQLite.
          schema:
            type: string
            maxLength: 255
        - name: locale
          in: query
          description: Must be an existing locale code (does not need to be active for filtering).
          schema:
            type: string
        - name: tags
          in: query
          description: >-
            Filter by tags; a translation matches if it has ANY of the
            given tags (OR behavior). Accepts either a comma-separated
            string (`tags=web,mobile`) or repeated array parameters
            (`tags[]=web&tags[]=mobile`). Maximum 20 tags, each up to 50
            characters.
          style: form
          explode: true
          schema:
            oneOf:
              - type: string
                example: web,mobile
              - type: array
                maxItems: 20
                items:
                  type: string
                  maxLength: 50
        - name: per_page
          in: query
          description: Results per page. Defaults to 25.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: sort_by
          in: query
          description: Defaults to `id`.
          schema:
            type: string
            enum: [id, created_at, updated_at]
            default: id
        - name: sort_direction
          in: query
          description: Defaults to `desc`.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: cursor
          in: query
          description: Opaque cursor from a previous response's `meta.next_cursor` or `meta.prev_cursor`.
          schema:
            type: string
      responses:
        '200':
          description: A cursor page of translations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationListResponse'
              example:
                data:
                  - id: 1
                    key: homepage.hero.title
                    description: Hero section headline
                    locale:
                      code: en
                      name: English
                    content: Welcome!
                    tags: [web, marketing]
                    created_at: '2026-09-03T12:00:00.000000Z'
                    updated_at: '2026-09-03T12:00:00.000000Z'
                links:
                  first: null
                  last: null
                  prev: null
                  next: 'http://localhost:8000/api/translations?cursor=eyJpZCI6MSwiX3BvaW50c1RvTmV4dEl0ZW1zIjp0cnVlfQ'
                meta:
                  path: 'http://localhost:8000/api/translations'
                  per_page: 25
                  next_cursor: 'eyJpZCI6MSwiX3BvaW50c1RvTmV4dEl0ZW1zIjp0cnVlfQ'
                  prev_cursor: null
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

    post:
      tags: [Translations]
      operationId: createTranslation
      summary: Create a translation
      description: >-
        Creates (or reuses) a translation key and stores its content for
        the given locale. `key` and `tags` are normalized (lowercased,
        trimmed, de-duplicated) before validation. A duplicate `(key,
        locale)` pair is rejected with a 422 on the `key` field. Throttled
        by the `api` rate limiter.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationCreateRequest'
            example:
              key: homepage.hero.title
              locale: en
              content: Welcome!
              description: Hero section headline
              tags: [web, marketing]
      responses:
        '201':
          description: Translation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationResourceResponse'
              example:
                data:
                  id: 1
                  key: homepage.hero.title
                  description: Hero section headline
                  locale:
                    code: en
                    name: English
                  content: Welcome!
                  tags: [web, marketing]
                  created_at: '2026-09-03T12:00:00.000000Z'
                  updated_at: '2026-09-03T12:00:00.000000Z'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '422':
          description: >-
            Validation failed, including a duplicate `(key, locale)` pair,
            an invalid or inactive locale, or an invalid key/tag format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: The given data was invalid.
                errors:
                  key:
                    - A translation for this key and locale already exists.
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /api/translations/{translation}:
    parameters:
      - name: translation
        in: path
        required: true
        description: Translation ID.
        schema:
          type: integer

    get:
      tags: [Translations]
      operationId: getTranslation
      summary: Show a single translation
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The requested translation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationResourceResponse'
              example:
                data:
                  id: 1
                  key: homepage.hero.title
                  description: Hero section headline
                  locale:
                    code: en
                    name: English
                  content: Welcome!
                  tags: [web, marketing]
                  created_at: '2026-09-03T12:00:00.000000Z'
                  updated_at: '2026-09-03T12:00:00.000000Z'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

    put:
      tags: [Translations]
      operationId: replaceTranslation
      summary: Update a translation
      description: >-
        All fields are optional (`sometimes`); only the fields present in
        the request body are changed. Identical behavior to `PATCH` on
        this endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationUpdateRequest'
            example:
              content: Welcome back!
              tags: [web]
      responses:
        '200':
          description: Translation updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationResourceResponse'
              example:
                data:
                  id: 1
                  key: homepage.hero.title
                  description: Hero section headline
                  locale:
                    code: en
                    name: English
                  content: Welcome back!
                  tags: [web]
                  created_at: '2026-09-03T12:00:00.000000Z'
                  updated_at: '2026-09-03T12:05:00.000000Z'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

    patch:
      tags: [Translations]
      operationId: updateTranslation
      summary: Update a translation
      description: >-
        All fields are optional (`sometimes`); only the fields present in
        the request body are changed. Identical behavior to `PUT` on this
        endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranslationUpdateRequest'
            example:
              content: Welcome back!
              tags: [web]
      responses:
        '200':
          description: Translation updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationResourceResponse'
              example:
                data:
                  id: 1
                  key: homepage.hero.title
                  description: Hero section headline
                  locale:
                    code: en
                    name: English
                  content: Welcome back!
                  tags: [web]
                  created_at: '2026-09-03T12:00:00.000000Z'
                  updated_at: '2026-09-03T12:05:00.000000Z'
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

    delete:
      tags: [Translations]
      operationId: deleteTranslation
      summary: Delete a translation
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Translation deleted. No response body.
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  /api/locales/{locale}/translations/export:
    get:
      tags: [Export]
      operationId: exportTranslations
      summary: Export all translations for a locale
      description: >-
        Returns a flat JSON object of `{ "key": "content" }` pairs for
        every translation in the given locale, optionally filtered by
        tags (OR behavior). An unknown or inactive locale code returns
        404. An empty result set returns `{}`, not `[]`. Throttled by the
        `api` rate limiter.
      security:
        - bearerAuth: []
      parameters:
        - name: locale
          in: path
          required: true
          description: Locale code (e.g. `en`), not a numeric ID.
          schema:
            type: string
        - name: tags
          in: query
          description: >-
            Filter by tags; a translation matches if it has ANY of the
            given tags (OR behavior). Accepts either a comma-separated
            string (`tags=web,mobile`) or repeated array parameters
            (`tags[]=web&tags[]=mobile`). Maximum 20 tags, each up to 50
            characters.
          style: form
          explode: true
          schema:
            oneOf:
              - type: string
                example: web,mobile
              - type: array
                maxItems: 20
                items:
                  type: string
                  maxLength: 50
      responses:
        '200':
          description: Flat key/content export for the locale.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslationExport'
              examples:
                withTranslations:
                  summary: Locale with translations
                  value:
                    auth.login: Login
                    auth.logout: Logout
                empty:
                  summary: Locale with no matching translations
                  value: {}
        '401':
          $ref: '#/components/responses/UnauthenticatedResponse'
        '404':
          description: The requested locale does not exist or is inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
              example:
                message: Requested resource was not found.
                errors:
                  locale:
                    - The requested locale does not exist or is inactive.
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  responses:
    UnauthenticatedResponse:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthenticatedError'
          example:
            message: Unauthenticated.

    NotFoundResponse:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
          example:
            message: Requested resource was not found.

    ValidationErrorResponse:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: The given data was invalid.
            errors:
              content:
                - The content field is required.

    TooManyRequestsResponse:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsError'
          example:
            message: Too Many Attempts.

  schemas:
    User:
      type: object
      description: The authenticated user. `password` and `remember_token` are never serialized.
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        email_verified_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
      required: [id, name, email]

    AuthenticationResponse:
      type: object
      description: Returned by both register and login.
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: string
              description: Sanctum plain-text token. Shown only once, at creation.
            token_type:
              type: string
              const: Bearer
          required: [user, token, token_type]
      required: [message, data]

    RegistrationRequest:
      type: object
      description: >-
        Password must be at least 8 characters and include letters
        (uppercase and lowercase) and numbers (Laravel's
        Password::min(8)->letters()->mixedCase()->numbers() rule).
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
          description: Must be unique among registered users.
        password:
          type: string
          format: password
          minLength: 8
          description: Requires letters, mixed case, and numbers. Must match password_confirmation.
        password_confirmation:
          type: string
          format: password
        device_name:
          type: [string, 'null']
          maxLength: 100
          description: Optional Sanctum token name. Defaults to "api-token" when omitted.
      required: [name, email, password, password_confirmation]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device_name:
          type: [string, 'null']
          maxLength: 100
          description: Optional Sanctum token name. Defaults to "api-token" when omitted.
      required: [email, password]

    Locale:
      type: object
      properties:
        code:
          type: string
          description: e.g. "en", "fr".
        name:
          type: string
      required: [code, name]

    Translation:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
          description: Lowercase, dot/underscore/hyphen-separated identifier shared across locales.
        description:
          type: [string, 'null']
          maxLength: 500
        locale:
          $ref: '#/components/schemas/Locale'
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        created_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: [string, 'null']
          format: date-time
      required: [id, key, description, locale, content, tags]

    TranslationCreateRequest:
      type: object
      properties:
        key:
          type: string
          maxLength: 255
          pattern: '^[a-z0-9._-]+$'
          description: Normalized to lowercase/trimmed before validation.
        description:
          type: [string, 'null']
          maxLength: 500
        locale:
          type: string
          description: Must reference an existing, active locale code.
        content:
          type: string
          minLength: 1
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
            pattern: '^[a-z0-9._-]+$'
          description: Normalized to lowercase, trimmed, and de-duplicated before validation.
      required: [key, locale, content]

    TranslationUpdateRequest:
      type: object
      description: All properties are optional; only fields present in the request are changed.
      properties:
        content:
          type: string
          minLength: 1
        description:
          type: [string, 'null']
          maxLength: 500
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 50
            pattern: '^[a-z0-9._-]+$'
          description: Normalized to lowercase, trimmed, and de-duplicated before validation. When present, replaces the translation's complete tag set.

    TranslationResourceResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Translation'
      required: [data]

    TranslationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Translation'
        links:
          $ref: '#/components/schemas/CursorPaginationLinks'
        meta:
          $ref: '#/components/schemas/CursorPaginationMeta'
      required: [data, links, meta]

    CursorPaginationLinks:
      type: object
      description: Cursor pagination does not support jumping to a first/last page, so those are always null.
      properties:
        first:
          type: [string, 'null']
        last:
          type: [string, 'null']
        prev:
          type: [string, 'null']
        next:
          type: [string, 'null']
      required: [first, last, prev, next]

    CursorPaginationMeta:
      type: object
      properties:
        path:
          type: string
        per_page:
          type: integer
        next_cursor:
          type: [string, 'null']
        prev_cursor:
          type: [string, 'null']
      required: [path, per_page, next_cursor, prev_cursor]

    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required: [message, errors]

    UnauthenticatedError:
      type: object
      properties:
        message:
          type: string
          example: Unauthenticated.
      required: [message]

    NotFoundError:
      type: object
      properties:
        message:
          type: string
          example: Requested resource was not found.
        errors:
          type: object
          description: Present only on the locale export endpoint's 404 (an invalid/inactive locale).
          additionalProperties:
            type: array
            items:
              type: string
      required: [message]

    TooManyRequestsError:
      type: object
      properties:
        message:
          type: string
          example: Too Many Attempts.
      required: [message]

    TranslationExport:
      type: object
      description: >-
        A dynamic flat object of translation-key to content pairs for one
        locale. Keys are not fixed/known ahead of time. An empty result is
        `{}`, never `[]`.
      additionalProperties:
        type: string
